        function loadQuiz() {
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = data.map((q, i) => `
                <div class="question-block" id="q${i}">
                    <span class="question-text">${i+1}. ${q.question}</span>
                    ${q.options.map((opt, oi) => `
                        <label class="option">
                            <input type="radio" name="q${i}" value="${oi}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `).join('');
        }

        function checkAnswers() {
            let score = 0;
            data.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                const qBlock = document.getElementById(`q${i}`);
                const options = qBlock.querySelectorAll('.option');
                
                options.forEach((opt, oi) => {
                    if(oi === q.answer) opt.classList.add('correct');
                    if(selected && parseInt(selected.value) === oi && oi !== q.answer) opt.classList.add('wrong');
                });

                if(selected && parseInt(selected.value) === q.answer) score++;
            });

            document.getElementById('submit').style.display = 'none';
            const results = document.getElementById('results');
            results.style.display = 'block';
            document.getElementById('score-text').innerText = `Нәтиже: ${score} / ${data.length}`;
            window.scrollTo(0, 0);
        }

        loadQuiz();
    </script>
